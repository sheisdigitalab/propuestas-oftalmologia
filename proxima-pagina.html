<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Página de la web final · Dra. Katia Sotelo</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400;font-display:swap;src:url('fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:700;font-display:swap;src:url('fonts/plus-jakarta-sans-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:400;font-display:swap;src:url('fonts/playfair-display-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:400;font-style:italic;font-display:swap;src:url('fonts/playfair-display-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:Jost;font-weight:400;font-display:swap;src:url('fonts/jost-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:Merriweather;font-weight:700;font-display:swap;src:url('fonts/merriweather-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:400;font-display:swap;src:url('fonts/source-sans-3-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Source Sans 3';font-weight:700;font-display:swap;src:url('fonts/source-sans-3-latin-700-normal.woff2') format('woff2')}
*{box-sizing:border-box}
:root{--bg:#FAF6F0;--text:#1E1B18;--muted:#574D45;--accent:#24413A;--onaccent:#FFFFFF;--line:#E5DBCD;--chip:#FFFFFF;
  --head:'Plus Jakarta Sans',system-ui,sans-serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;--radius:6px;--hw:700;--hs:italic}
[data-e="elegante"]{--bg:#101C1A;--text:#EDE6DA;--muted:#D3CBBE;--accent:#D4BC94;--onaccent:#101C1A;--line:#33443F;--chip:#172623;
  --head:'Playfair Display',Georgia,serif;--body:Jost,system-ui,sans-serif;--radius:0;--hw:400}
[data-e="clasico"]{--bg:#F2F5F8;--text:#1C2733;--muted:#4A5868;--accent:#1E3A5F;--onaccent:#FFFFFF;--line:#DCE4EC;--chip:#FFFFFF;
  --head:Merriweather,Georgia,serif;--body:'Source Sans 3',system-ui,sans-serif;--radius:4px;--hw:700}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
.aviso{background:var(--accent);color:var(--onaccent);text-align:center;padding:10px 16px;font-size:14px}
main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:72px 24px 80px;display:flex;flex-direction:column;gap:28px}
.kicker{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
[data-e="elegante"] .kicker{font-weight:400}
h1{margin:0;font-family:var(--head);font-weight:var(--hw);font-size:clamp(36px,6vw,56px);line-height:1.12;letter-spacing:-.01em}
h2{margin:0;font-family:var(--head);font-weight:var(--hw);font-size:22px}
p{margin:0;color:var(--muted);max-width:60ch}
ul.inc{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
ul.inc li{padding:16px 0;border-bottom:1px solid var(--line);color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-height:56px;padding:12px 30px;background:var(--accent);color:var(--onaccent);text-decoration:none;font-weight:700;font-size:17px;border-radius:var(--radius)}
.btn:hover,.btn:focus-visible{filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.map{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.map a{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border:1px solid var(--line);background:var(--chip);color:var(--text);text-decoration:none;border-radius:var(--radius);font-size:16px}
.map a[aria-current]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.map a:hover{border-color:var(--accent)}
@media (max-width:600px){main{padding:48px 20px 64px}.btn{align-self:stretch}}
</style>
</head>
<body data-e="calido">
<div class="aviso">Propuesta de diseño · Esta página formará parte de la web final</div>
<main>
  <h1 id="titulo">Próxima página</h1>
  <p id="intro">Esta propuesta muestra solo la portada. Así queda planteada esta página en la web completa.</p>
  <h2>Qué incluirá</h2>
  <ul class="inc" id="incluye"></ul>
  <a class="btn" id="volver" href="estilo-calido/">← Volver a la propuesta</a>
  <h2>Mapa de la web</h2>
  <ul class="map" id="mapa"></ul>
</main>
<script>
(function(){
  var P={
    'cataratas':['Cirugía de cataratas',['Qué son las cataratas y cómo detectarlas','La cirugía paso a paso y tipos de lente intraocular','Recuperación, cuidados y revisiones','Preguntas frecuentes sobre cataratas']],
    'parpados':['Cirugía de párpados',['Cuándo está indicada: párpado caído, exceso de piel y lesiones','Técnicas y resultados que se pueden esperar','Recuperación y cuidados','Preguntas frecuentes sobre párpados']],
    'doctora':['La doctora',['Trayectoria y formación','Sociedades científicas y colegiación','Centros donde opera','Cómo entiende la relación con sus pacientes']],
    'primera-visita':['Primera visita',['Qué pruebas se hacen y cuánto dura','Qué traer a la consulta','Cómo prepararse y qué esperar después','Reserva de cita online']],
    'preguntas':['Preguntas frecuentes',['Todas las dudas, ordenadas por cirugía','Costes, financiación y aseguradoras','Antes, durante y después de la operación']],
    'contacto':['Contacto',['Centros, direcciones y cómo llegar','Teléfono, WhatsApp y correo','Formulario de contacto','Horarios de consulta']],
    'legal':['Textos legales',['Aviso legal','Política de privacidad','Política de cookies']]
  };
  var q=new URLSearchParams(location.search),k=q.get('p'),e=q.get('e');
  if(['calido','elegante','clasico'].indexOf(e)<0)e='calido';
  document.body.setAttribute('data-e',e);
  var d=P[k]||['Próxima página',[]];
  document.title=d[0]+' · Página de la web final · Dra. Katia Sotelo';
  document.getElementById('titulo').textContent=d[0];
  var ul=document.getElementById('incluye');
  d[1].forEach(function(t){var li=document.createElement('li');li.textContent=t;ul.appendChild(li)});
  if(!d[1].length)ul.hidden=true;
  document.getElementById('volver').href='estilo-'+e+'/';
  var m=document.getElementById('mapa');
  [['','Inicio'],['cataratas','Cataratas'],['parpados','Párpados'],['doctora','La doctora'],['primera-visita','Primera visita'],['preguntas','Preguntas'],['contacto','Contacto']].forEach(function(it){
    var li=document.createElement('li'),a=document.createElement('a');
    a.textContent=it[1];
    a.href=it[0]?('proxima-pagina.html?p='+it[0]+'&e='+e):('estilo-'+e+'/');
    if(it[0]===k)a.setAttribute('aria-current','page');
    li.appendChild(a);m.appendChild(li)
  });
})();
</script>
</body>
</html>
